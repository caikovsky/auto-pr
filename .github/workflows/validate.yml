name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck skills/autopr/scripts/*.sh tests/*.sh

      - name: gather.sh tests
        run: bash tests/gather.test.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: astral-sh/setup-uv@v5

      - name: Claude Code plugin manifest
        run: npx --yes @anthropic-ai/claude-code plugin validate --strict .

      - name: skills CLI discovery
        run: npx --yes skills add . --list

      - name: Agent Skills spec
        run: uvx --from skills-ref agentskills validate skills/autopr
